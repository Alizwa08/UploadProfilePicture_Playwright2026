name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 00:00 SAST (South Africa is UTC+2, no daylight saving)
  workflow_dispatch:        # lets you manually trigger a run from the GitHub Actions tab

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      NDOSI_EMAIL: ${{ secrets.NDOSI_EMAIL }}
      NDOSI_PASSWORD: ${{ secrets.NDOSI_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
